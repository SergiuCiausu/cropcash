<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Futures Preview</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; overflow-x: hidden; font: 500 16px/1.4 system-ui, sans-serif; color: #14213d; background: linear-gradient(150deg, #f3e7f8, #cdbcf5 55%, #a48ee8); }
.board { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px; padding: 48px 32px; min-height: 100vh; isolation: isolate; }
.deco { position: absolute; z-index: -1; }
.laptop { width: 760px; flex: none; }
.lid { padding: 12px; border-radius: 18px 18px 0 0; background: #15182a; box-shadow: 0 34px 60px -30px rgba(40, 25, 110, .75); }
.lid .win { width: 736px; height: 460px; overflow: hidden; border-radius: 6px; background: #efeaf9; }
.lid iframe { width: 1440px; height: 900px; border: 0; transform: scale(.5111); transform-origin: 0 0; }
.base { height: 15px; margin: 0 -32px; border-radius: 0 0 16px 16px; background: linear-gradient(#d8d6e4, #a9a7bb); }
.phones { display: flex; gap: 20px; align-items: flex-start; }
.phone { flex: none; width: 232px; padding: 8px; border-radius: 40px; background: linear-gradient(150deg, #2b2f45, #0c0f1c); box-shadow: 0 30px 50px -26px rgba(40, 25, 110, .8), inset 0 0 0 2px #4b4f69; }
.phone:nth-child(2) { margin-top: 44px; }
.phone .win { position: relative; width: 216px; height: 466px; overflow: hidden; border-radius: 33px; background: #efeaf9; }
.phone iframe { width: 390px; height: 841px; border: 0; transform: scale(.5538); transform-origin: 0 0; }
p { flex-basis: 100%; margin: 0; text-align: center; }
a { color: inherit; font-weight: 700; }
@media (max-width: 1000px) { .laptop { display: none; } }
@media (max-width: 640px) { .phone:nth-child(n+2) { display: none; } }
</style>
</head>
<body>
<div class="board">
  <svg class="deco" style="left:2%;top:40px;width:96px" viewBox="0 0 100 100" aria-hidden="true"><path fill="#7e62e6" d="M50 4 92 30 84 76 44 96 10 62 16 22Z"/><path fill="#9a84f0" d="M50 4 58 44 16 22Z"/><path fill="#6548d2" d="M58 44 92 30 84 76Z"/><path fill="#5a3fc4" d="M58 44 84 76 44 96Z"/></svg>
  <svg class="deco" style="right:3%;bottom:36px;width:72px" viewBox="0 0 70 70" aria-hidden="true"><defs><radialGradient id="pearl" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#c9bdeb"/></radialGradient></defs><circle cx="35" cy="35" r="34" fill="url(#pearl)"/></svg>
  <svg class="deco" style="left:1%;bottom:-6px;width:170px" viewBox="0 0 170 240" aria-hidden="true" fill="#6a4fd0" opacity=".6"><path d="M85 240C80 170 80 90 85 18" fill="none" stroke="#6a4fd0" stroke-width="3.5"/><g id="grain"><ellipse cx="66" cy="60" rx="9" ry="20" transform="rotate(-24 66 60)"/><ellipse cx="104" cy="60" rx="9" ry="20" transform="rotate(24 104 60)"/><ellipse cx="62" cy="100" rx="9" ry="20" transform="rotate(-24 62 100)"/><ellipse cx="108" cy="100" rx="9" ry="20" transform="rotate(24 108 100)"/><ellipse cx="62" cy="140" rx="9" ry="20" transform="rotate(-24 62 140)"/><ellipse cx="108" cy="140" rx="9" ry="20" transform="rotate(24 108 140)"/><ellipse cx="85" cy="24" rx="9" ry="22"/></g></svg>

  <div class="laptop">
    <div class="lid"><div class="win"><iframe src="index.html?view=home" title="Laptop view of the app" tabindex="-1"></iframe></div></div>
    <div class="base"></div>
  </div>
  <div class="phones">
    <div class="phone"><div class="win"><iframe src="index.html?view=home" title="Phone view, home" tabindex="-1"></iframe></div></div>
    <div class="phone"><div class="win"><iframe src="index.html?view=stats&theme=night" title="Phone view, forecast at night" tabindex="-1"></iframe></div></div>
  </div>
  <p>These are live views. <a href="index.html">Open the full app</a></p>
</div>
</body>
</html>
