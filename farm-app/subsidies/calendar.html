<!doctype html>
<html lang="ro" data-default-palette="both">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B4E85C">
<title>Calendar · CropCash</title>
<link rel="stylesheet" href="../mobile/shared.css">
<link rel="stylesheet" href="../desktop/desktop.css">
<link rel="stylesheet" href="../desktop/rail.css">
<link rel="stylesheet" href="subsidies.css">
</head>
<body>
<main class="main">
  <div>
    <header class="page-h"><div><h1>Calendar</h1><p class="lead">Bani, termene și lucrări, pe un singur an.</p></div></header>
    <p class="offline" data-offline hidden>Nu ai internet. Vezi ultimele date salvate. Ce bifezi se trimite când ai internet.</p>

    <section class="card cal" id="cal" aria-labelledby="cal-title">
      <div class="cal-h">
        <h2 id="cal-title" aria-live="polite"></h2>
        <div class="cal-nav">
          <button type="button" data-cal="today">Azi</button>
          <button type="button" class="cal-arrow" data-cal="prev" aria-label="Luna trecută"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
          <button type="button" class="cal-arrow" data-cal="next" aria-label="Luna viitoare"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="cal-body">
        <div class="cal-main">
          <div class="cal-week" aria-hidden="true"><span>L</span><span>Ma</span><span>Mi</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div class="cal-side">
          <div class="cal-day" id="cal-day" aria-live="polite"></div>
          <div class="cal-month" id="cal-month"></div>
        </div>
      </div>
    </section>

    <section class="cta field verdict" id="next"></section>

    <div class="vtabs" role="group" aria-label="Ce arăt" id="vtabs"></div>
    <div id="list"></div>
    <div id="done"></div>
    <section class="card remember" id="remember"></section>
    <p class="note gap" id="foot"></p>
    <a class="btn btn-dark next-step" href="prognoza.html">Mai departe: prognoza pe un an</a>
  </div>
</main>
<dialog class="detail" id="detail" aria-labelledby="d-title"></dialog>
<script src="../mobile/shared.js"></script>
<script src="engine.js"></script>
<script src="data-calls.js"></script>
<script src="app.js"></script>
<script src="calendar.js"></script>
<script src="notifications.js"></script>
</body>
</html>
