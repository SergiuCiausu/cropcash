<!doctype html>
<html lang="ro" data-default-palette="both">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B4E85C">
<title>Intră în cont · CropCash</title>
<link rel="stylesheet" href="../mobile/shared.css">
<link rel="stylesheet" href="../desktop/desktop.css">
<link rel="stylesheet" href="../desktop/rail.css">
<link rel="stylesheet" href="subsidies.css">
</head>
<body>
<main class="ob">
  <form class="ob-card" id="form">
    <div class="ob-top"><span class="logo"><span class="mark" id="mark"></span><span>CropCash</span></span></div>
    <h1 id="title" tabindex="-1"></h1>
    <p class="lead" id="tagline"></p>
    <label class="ob-field"><span id="email-label"></span><input id="email" type="email" inputmode="email" autocomplete="email" required></label>
    <label class="ob-field"><span id="password-label"></span><input id="password" type="password" autocomplete="current-password" required minlength="6"></label>
    <p class="lead" id="hint" hidden></p>
    <p class="ob-err" id="error" role="alert" hidden></p>
    <p class="lead" id="info" role="status" hidden></p>
    <div class="ob-actions">
      <button type="submit" class="btn btn-dark" id="submit"></button>
      <button type="button" class="btn btn-line" id="switch"></button>
    </div>
  </form>
</main>
<script src="../mobile/shared.js"></script>
<script src="../config.js"></script>
<script src="../live.js"></script>
<script src="login.js"></script>
</body>
</html>
