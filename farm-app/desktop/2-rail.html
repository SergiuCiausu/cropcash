<!doctype html>
<html lang="ro" data-default-palette="both">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B4E85C">
<title>Acasă · CropCash</title>
<!-- The links in the frame are relative to the other pages, so this one shares their folder. -->
<base href="../subsidies/">
<link rel="stylesheet" href="../mobile/shared.css">
<link rel="stylesheet" href="../desktop/desktop.css">
<link rel="stylesheet" href="../desktop/rail.css">
<link rel="stylesheet" href="subsidies.css">
</head>
<body>
<main class="main">
  <div>
    <header class="page-h">
      <div><h1 id="hello"></h1><p class="lead" id="lead"></p></div>
      <div class="acts"><a class="btn btn-dark" href="recolte.html">Notează o vânzare</a></div>
    </header>
    <p class="offline" data-offline hidden>Nu ai internet. Vezi ultimele date salvate pe acest telefon.</p>

    <div class="bento">
      <section class="card chart-card hero-card s8">
        <p class="eyebrow">Salariul tău</p>
        <p class="amount" id="h-amount"></p>
        <p class="why" id="h-why"></p>
        <div class="chart fc-chart" id="fc"></div>
      </section>
      <div class="s4 side-stats ac-side">
        <section class="card kpi"><p class="lbl">Bani la tine acum</p><p class="n20" id="now"></p><p class="sub2" id="low"></p></section>
        <a class="card kpi kpi-link" id="old-age" href="pensie.html"><p class="lbl">Bătrânețe</p><p class="n20" id="old-month"></p><p class="sub2" id="old-sum"></p></a>
      </div>
    </div>

    <div class="tiles gap" id="tiles"></div>

    <div class="bento gap">
      <section class="card s7"><div class="card-h"><h2>Ce urmează</h2></div><ol class="ac-list" id="coming"></ol><p class="note"><a href="calendar.html">Vezi tot calendarul</a></p></section>
      <section class="card s5 ac-calls"><div class="card-h"><h2>Oportunități</h2></div><ol class="ac-list" id="calls"></ol><p class="note"><a href="oportunitati.html">Vezi toate oportunitățile</a></p></section>
      <section class="card s12" id="weather" hidden></section>
    </div>
  </div>
</main>
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/react-is.production.min.js"></script>
<script src="../vendor/Recharts.js"></script>
<script src="../mobile/shared.js"></script>
<script src="engine.js"></script>
<script src="data-calls.js"></script>
<script src="app.js"></script>
<script src="chart.js"></script>
<script src="acasa.js"></script>
<script src="notifications.js"></script>
</body>
</html>
