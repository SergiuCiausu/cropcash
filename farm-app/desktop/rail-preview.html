<!doctype html>
<html lang="en" data-default-palette="both">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm Futures: Rail preview</title>
<link rel="stylesheet" href="../mobile/shared.css">
<style>
body { display: block !important; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg) !important; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 16px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
h1 { font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
.ctl { display: flex; flex-wrap: wrap; gap: 6px; }
.ctl button { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 1px solid var(--hair-2); border-radius: 12px; background: var(--surface); font-size: 13.5px; font-weight: 500; }
.ctl button[aria-pressed="true"] { border-color: var(--text-1); background: var(--hero); color: var(--on-hero); }
.ctl i { position: relative; overflow: hidden; width: 16px; height: 16px; border-radius: 50%; background: var(--c1); }
.ctl i::before, .ctl i::after { content: ""; position: absolute; inset: 0; }
.ctl i::before { z-index: 1; background: var(--c3); clip-path: polygon(100% 45%, 100% 100%, 45% 100%); }
.ctl i::after { background: var(--c2); clip-path: polygon(100% 0, 100% 100%, 0 100%); }
.stage { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 12px; }
figure { margin: 0; min-width: 0; }
figcaption { margin-bottom: 6px; font-size: 13.5px; font-weight: 600; }
.phone { width: 390px; height: 844px; overflow: hidden; border-radius: 28px; outline: 1px solid var(--hair-2); background: var(--surface); }
.phone iframe { width: 390px; height: 844px; border: 0; }
.laptop { position: relative; overflow: hidden; border-radius: 16px; outline: 1px solid var(--hair-2); background: var(--surface); }
.laptop iframe { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; border: 0; transform-origin: top left; }
@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } .phone { max-width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Rail on phone and laptop</h1>
    <div class="ctl" id="pals" role="group" aria-label="Palette for both"></div>
    <div class="ctl" id="views" role="group" aria-label="Screen for both"></div>
  </div>
  <div class="stage">
    <figure><figcaption>Phone, 390 by 844</figcaption><div class="phone"><iframe src="2-rail.html?palette=default" title="Rail on a phone"></iframe></div></figure>
    <figure><figcaption>Laptop, 1440 by 900</figcaption><div class="laptop" id="laptop"><iframe id="big" src="2-rail.html?palette=default" title="Rail on a laptop"></iframe></div></figure>
  </div>
</div>
<script src="../mobile/shared.js"></script>
<script>
const send = (m) => document.querySelectorAll("iframe").forEach((f) => f.contentWindow.postMessage({ type: "farm", ...m }, "*"));
const pals = document.getElementById("pals"), views = document.getElementById("views"), big = document.getElementById("big"), laptop = document.getElementById("laptop");
pals.innerHTML = `<button type="button" data-p="default" aria-pressed="true">Field, Violet & Gold</button>` + FF.PALETTES.filter((p) => p.id !== "both").map((p) => `<button type="button" data-p="${p.id}" aria-pressed="false" style="--c1:${p.v.a};--c2:${p.v.b};--c3:${FF.tokens(p).c}"><i></i>${p.name}</button>`).join("");
views.innerHTML = [["home", "Home"], ["stats", "Forecast"], ["fields", "Fields"], ["reserve", "Reserves"]].map(([v, n], i) => `<button type="button" data-v="${v}" aria-pressed="${!i}">${n}</button>`).join("");
const press = (box, b) => box.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
pals.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; press(pals, b); send({ palette: b.dataset.p }); FF.palette(b.dataset.p, false); });
views.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; press(views, b); send({ view: b.dataset.v }); });
const fit = () => { const s = Math.min(1, laptop.clientWidth / 1440); big.style.transform = `scale(${s})`; laptop.style.height = `${900 * s}px`; };
FF.palette("default", false);
addEventListener("resize", fit); fit();
</script>
</body>
</html>
