<!doctype html>
<html lang="en" data-variant="Lights">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financial Futures: Lights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #04060d;
  --ink-2: #0a0f1d;
  --line: rgba(170, 200, 255, .18);
  --line-strong: rgba(170, 200, 255, .38);
  --text: #eef3ff;
  --muted: #a4b2cf;
  --blue: #7fb6ff;
  --ice: #c9e2ff;
  --gold: #ffc873;
  --wrap: min(1240px, calc(100vw - 96px));
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--ink); }
body {
  margin: 0; color: var(--text); background: var(--ink);
  font: 400 17px/1.6 "Hanken Grotesk", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
h2 { font-weight: 200; font-size: clamp(36px, 4.6vw, 64px); line-height: 1.08; letter-spacing: -.025em; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }
.wrap { width: var(--wrap); margin-inline: auto; }
.lede { color: var(--muted); font-size: 19px; max-width: 46ch; }
svg { display: block; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 12px; height: 50px; padding: 0 26px; border-radius: 99px; font-weight: 500; font-size: 16px; white-space: nowrap; transition: transform .35s cubic-bezier(.16,1,.3,1), background .3s, border-color .3s; }
.btn span[data-icon] { width: 18px; height: 18px; transition: transform .35s cubic-bezier(.16,1,.3,1); }
.btn:hover span[data-icon] { transform: translateX(4px); }
.btn.solid { background: #fff; color: #060a14; }
.btn.solid:hover { background: var(--ice); }
.btn.ghost { color: var(--text); padding-inline: 8px; }
.btn.ghost .ring { width: 44px; height: 44px; border: 1px solid var(--line-strong); border-radius: 50%; display: grid; place-items: center; transition: border-color .3s; }
.btn.ghost:hover .ring { border-color: #fff; }
.btn.ghost .ring span { width: 16px; height: 16px; transform: rotate(90deg); }
.btn.ghost:hover .ring span { transform: rotate(90deg) translateX(3px); }

/* Nav */
header { position: absolute; inset: 0 0 auto; z-index: 5; }
.nav { display: flex; align-items: center; justify-content: space-between; height: 92px; }
.logo { display: flex; align-items: center; gap: 12px; white-space: nowrap; letter-spacing: .24em; text-transform: uppercase; font-size: 13px; }
.logo svg { width: 28px; height: 28px; }
.nav ul { display: flex; gap: 40px; list-style: none; margin: 0; padding: 0; font-size: 15px; color: var(--muted); }
.nav ul a:hover { color: #fff; }
.nav .pill { display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 20px; border: 1px solid var(--line-strong); border-radius: 99px; font-size: 15px; transition: background .3s, color .3s; }
.nav .pill:hover { background: #fff; color: #060a14; }
.nav .pill span { width: 16px; height: 16px; }

/* Hero */
.hero { position: relative; min-height: 100svh; display: flex; align-items: center; overflow: hidden; isolation: isolate; }
#bird { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.hero::after { content: ""; position: absolute; inset: auto 0 0; height: 160px; background: linear-gradient(transparent, var(--ink)); z-index: -1; pointer-events: none; }
.hero .wrap { padding-block: 120px 96px; }
.copy { max-width: 620px; position: relative; }
.copy::before { content: ""; position: absolute; inset: -80px -120px; z-index: -1; background: radial-gradient(closest-side, rgba(4,6,13,.82), transparent); pointer-events: none; }
h1 { font-weight: 200; font-size: clamp(50px, 5.5vw, 80px); line-height: 1.06; letter-spacing: -.035em; }
h1 span { display: block; white-space: nowrap; }
h1 .b { background: linear-gradient(95deg, #fff 0%, var(--ice) 18%, var(--blue) 62%, #a99bff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .1em; }
.copy .lede { margin-top: 26px; }
.actions { display: flex; align-items: center; gap: 20px; margin-top: 38px; flex-wrap: wrap; }

/* Callouts tethered to the bird */
#tethers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
#tethers path { fill: none; stroke: rgba(190, 215, 255, .5); stroke-width: 1; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.8s .8s cubic-bezier(.16,1,.3,1) forwards; }
#tethers circle { fill: var(--gold); opacity: 0; animation: pop .5s 2.2s forwards; filter: drop-shadow(0 1px 4px rgba(255, 200, 115, .9)); }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { to { opacity: 1; } }
.call { position: absolute; z-index: 2; width: 214px; padding: 13px 15px 14px; background: rgba(9, 16, 34, .56); border: 1px solid var(--line-strong); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; animation: rise .9s 1.4s cubic-bezier(.16,1,.3,1) forwards; }
.call:nth-of-type(2) { animation-delay: 1.6s; }
.call:nth-of-type(3) { animation-delay: 1.8s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.call small { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.call small i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex: none; }
.call b { display: block; margin-top: 3px; font-weight: 400; font-size: 21px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.call svg { width: 100%; height: 30px; margin-top: 6px; }
.tag { position: absolute; left: max(48px, calc(50vw - 620px)); bottom: 34px; z-index: 2; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.tag b { color: var(--gold); font-weight: 400; }

/* How: one strand of light carries the four steps */
section { position: relative; }
.how { padding: 150px 0 120px; }
.how .intro { display: grid; grid-template-columns: 1.3fr 1fr; gap: 64px; align-items: end; }
.steps { position: relative; list-style: none; margin: 96px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 36px; }
#strand { position: absolute; left: 0; top: -12px; width: 100%; height: 60px; overflow: visible; }
#strand path { fill: none; stroke-linecap: round; }
.steps li { padding-top: 76px; position: relative; }
.steps li::before { content: ""; position: absolute; top: 9px; left: 0; width: 9px; height: 9px; border-radius: 50%; background: var(--ice); box-shadow: 0 1px 12px var(--blue); }
.steps b { display: block; font-weight: 300; font-size: 25px; letter-spacing: -.01em; line-height: 1.2; }
.steps p { color: var(--muted); margin-top: 12px; font-size: 16.5px; }

/* Features: a ledger of hairlines */
.features { padding: 100px 0 130px; }
.flist { list-style: none; margin: 64px 0 0; padding: 0; border-top: 1px solid var(--line); }
.flist li { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1.25fr); gap: 28px; align-items: center; padding: 28px 8px; border-bottom: 1px solid var(--line); transition: background .4s; }
.flist li:hover { background: linear-gradient(90deg, rgba(127,182,255,.08), transparent 70%); }
.flist .ic { width: 26px; height: 26px; color: var(--ice); }
.flist b { font-weight: 200; font-size: clamp(27px, 3.1vw, 42px); letter-spacing: -.02em; line-height: 1.15; }
.flist p { color: var(--muted); }

/* Preview: Ana's future as three strands of light */
.preview { padding: 110px 0; background: linear-gradient(var(--ink), var(--ink-2) 22%, var(--ink-2) 78%, var(--ink)); }
.preview .intro { max-width: 760px; }
.preview .intro .lede { margin-top: 20px; }
.stage { margin-top: 64px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 56px; align-items: stretch; }
.chart { position: relative; min-width: 0; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.axis { fill: var(--muted); font: 400 13px "Hanken Grotesk", sans-serif; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 99px; margin-bottom: 26px; flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 8px 16px; min-height: 22px; border-radius: 99px; color: var(--muted); font-size: 15px; transition: background .3s, color .3s; }
.seg button:hover { color: #fff; }
.seg button[aria-pressed="true"] { background: rgba(201,226,255,.14); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.readout { display: flex; flex-direction: column; border-left: 1px solid var(--line); padding-left: 36px; }
.readout .big { font-weight: 200; font-size: 46px; line-height: 1.05; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.readout dl { margin: 0; }
.readout dt { color: var(--muted); font-size: 14.5px; }
.readout dd { margin: 4px 0 26px; font-size: 21px; font-weight: 300; font-variant-numeric: tabular-nums; }
.readout dd.big { margin-top: 6px; font-size: 44px; font-weight: 200; }
.readout .note { margin-top: auto; color: var(--muted); font-size: 14px; line-height: 1.5; }
.badge { display: inline-block; margin-top: 18px; padding: 4px 11px; border: 1px solid rgba(255, 200, 115, .45); color: var(--gold); border-radius: 99px; font-size: 13px; }

/* Trust */
.trust { padding: 130px 0 100px; }
.trust .grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 80px; }
.tlist { list-style: none; margin: 0; padding: 0; }
.tlist li { display: grid; grid-template-columns: 26px 1fr; gap: 20px; padding: 0 0 34px; }
.tlist .ic { width: 22px; height: 22px; color: var(--gold); margin-top: 4px; }
.tlist b { display: block; font-weight: 400; font-size: 20px; line-height: 1.3; }
.tlist p { color: var(--muted); margin-top: 4px; font-size: 16.5px; }

/* Close */
.close { padding: 170px 0 150px; text-align: center; overflow: hidden; isolation: isolate; }
#embers { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.close h2 { font-size: clamp(44px, 6.3vw, 92px); }
.close p { color: var(--muted); margin: 22px auto 34px; max-width: 48ch; font-size: 19px; }

footer { border-top: 1px solid var(--line); padding: 28px 0 34px; color: var(--muted); font-size: 14.5px; }
footer .wrap { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }

@media (max-width: 1080px) {
  .nav ul { display: none; }
  .call { display: none; }
  #tethers { display: none; }
  .steps { grid-template-columns: 1fr 1fr; }
  #strand { display: none; }
  .steps li { padding-top: 26px; border-top: 1px solid var(--line); }
  .steps li::before { top: -5px; }
  .stage { grid-template-columns: 1fr; gap: 40px; }
  .readout { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 28px; }
  .trust .grid { grid-template-columns: 1fr; gap: 48px; }
}
@media (max-width: 720px) {
  :root { --wrap: calc(100vw - 40px); }
  body { font-size: 16.5px; }
  .nav { height: 76px; }
  .nav .pill { display: none; }
  .hero { align-items: flex-end; }
  .hero .wrap { padding-block: 56vh 72px; }
  .copy::before { inset: -90px -40px -40px; background: linear-gradient(transparent, rgba(4,6,13,.86) 34%, rgba(4,6,13,.86)); }
  h1 { font-size: clamp(36px, 11vw, 58px); }
  .tag { left: 20px; bottom: 18px; }
  .how { padding: 80px 0; }
  .how .intro { grid-template-columns: 1fr; gap: 20px; }
  .steps { grid-template-columns: 1fr; margin-top: 52px; }
  .features, .preview, .trust { padding-block: 72px; }
  .flist li { grid-template-columns: 30px 1fr; gap: 6px 14px; padding: 22px 0; }
  .flist p { grid-column: 2; }
  .close { padding: 110px 0 100px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  #tethers path { animation: none; stroke-dashoffset: 0; }
  #tethers circle { animation: none; opacity: 1; }
  .call { animation: none; opacity: 1; }
  .btn, .btn span[data-icon], .flist li { transition: none; }
}
</style>
</head>
<body>

<header>
  <nav class="nav wrap" aria-label="Main">
    <a class="logo" href="#top">
      <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 22C10 21 18 16 29 5"/><path d="M6 27c8-1 15-5 23-16"/><path d="M12 29c6-2 12-6 17-12"/></svg>
      <span data-c="brand"></span>
    </a>
    <ul data-each="nav"><template><li><a data-f="label" data-f-href="href"></a></li></template></ul>
    <a class="pill" href="#preview"><span data-c="cta.primary" style="width:auto;height:auto"></span><span data-icon="arrow"></span></a>
  </nav>
</header>

<main id="top">
  <section class="hero" aria-label="Introduction">
    <canvas id="bird" aria-hidden="true"></canvas>
    <svg id="tethers" aria-hidden="true"></svg>
    <div class="wrap">
      <div class="copy">
        <h1><span data-c="hero.lineA"></span><span class="b" data-c="hero.lineB"></span></h1>
        <p class="lede" data-c="hero.lede"></p>
        <div class="actions">
          <a class="btn solid" href="#preview"><span data-c="cta.primary" style="width:auto;height:auto"></span><span data-icon="arrow"></span></a>
          <a class="btn ghost" href="#how"><span class="ring"><span data-icon="arrow"></span></span><span data-c="cta.secondary" style="width:auto;height:auto"></span></a>
        </div>
      </div>
    </div>

    <aside class="call" data-anchor="568,74" style="right:6.5%;top:15%" aria-label="Sample: money found">
      <small><i></i>Found this month</small>
      <b id="c-found"></b>
    </aside>
    <aside class="call" data-anchor="610,232" style="right:3.5%;top:43%" aria-label="Sample: Greece goal">
      <small><i></i>Greece trip, on track</small>
      <b id="c-goal"></b>
      <svg viewBox="0 0 180 6" preserveAspectRatio="none" style="height:6px;margin-top:9px"><rect width="180" height="2" y="2" fill="rgba(170,200,255,.25)"/><rect width="43" height="2" y="2" fill="#ffc873"/></svg>
    </aside>
    <aside class="call" data-anchor="506,322" style="right:17%;top:75%" aria-label="Sample: retirement forecast">
      <small><i></i>Expected pot at 65</small>
      <b id="c-pot"></b>
    </aside>
    <p class="tag"><b>Sample data.</b> <span data-c="footnote"></span></p>
  </section>

  <section class="how" id="how">
    <div class="wrap">
      <div class="intro">
        <h2 data-c="how.title"></h2>
        <p class="lede" data-c="how.lede"></p>
      </div>
      <ol class="steps" data-each="how.steps">
        <template><li><b data-f="title"></b><p data-f="text"></p></li></template>
        <svg id="strand" viewBox="0 0 1240 60" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#c9e2ff"/><stop offset=".7" stop-color="#7fb6ff"/><stop offset="1" stop-color="#ffc873"/></linearGradient></defs>
          <path d="M0 14 C 200 2, 330 26, 420 14 S 700 2, 840 14 S 1120 24, 1240 8" stroke="url(#sg)" stroke-opacity=".28" stroke-width="5"/>
          <path d="M0 14 C 200 2, 330 26, 420 14 S 700 2, 840 14 S 1120 24, 1240 8" stroke="url(#sg)" stroke-width="1"/>
        </svg>
      </ol>
    </div>
  </section>

  <section class="features" id="features">
    <div class="wrap">
      <h2 data-c="features.title" style="max-width:17ch"></h2>
      <ul class="flist" data-each="features.items">
        <template><li><span class="ic" data-f-icon="icon"></span><b data-f="title"></b><p data-f="text"></p></li></template>
      </ul>
    </div>
  </section>

  <section class="preview" id="preview">
    <div class="wrap">
      <div class="intro">
        <h2 data-c="preview.title"></h2>
        <p class="lede" data-c="preview.lede"></p>
      </div>
      <div class="stage">
        <div class="chart">
          <div class="seg" role="group" aria-label="Forecast path">
            <button type="button" data-path="cautious" aria-pressed="false">Cautious</button>
            <button type="button" data-path="expected" aria-pressed="true">Expected</button>
            <button type="button" data-path="optimistic" aria-pressed="false">Optimistic</button>
          </div>
          <svg id="fan" viewBox="0 0 760 400" role="img" aria-label="Ana's retirement pot from age 29 to 65 on the three forecast paths"></svg>
        </div>
        <div class="readout">
          <dl>
            <dt>Pot at 65, in today's money</dt><dd class="big" id="r-pot"></dd>
            <dt>Money lasts until age</dt><dd id="r-age"></dd>
            <dt>Net worth today</dt><dd id="r-net"></dd>
          </dl>
          <p class="note">Assumes real yearly returns of 2%, 4% or 6%. State pension (Pillar I) and investment tax are not modeled.</p>
          <div><span class="badge" data-c="preview.label"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section class="trust" id="trust">
    <div class="wrap grid">
      <h2 data-c="trust.title"></h2>
      <ul class="tlist" data-each="trust.items">
        <template><li><span class="ic" data-f-icon="icon"></span><div><b data-f="title"></b><p data-f="text"></p></div></li></template>
      </ul>
    </div>
  </section>

  <section class="close">
    <canvas id="embers" aria-hidden="true"></canvas>
    <div class="wrap">
      <h2 data-c="close.title"></h2>
      <p data-c="close.lede"></p>
      <a class="btn solid" href="#preview"><span data-c="cta.primary" style="width:auto;height:auto"></span><span data-icon="arrow"></span></a>
    </div>
  </section>
</main>

<footer><div class="wrap"><span data-c="brand"></span><span data-c="footnote"></span></div></footer>

<script src="content.js"></script>
<script>
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- Bird of light ----------
   Scene space is 736 x 414, the same frame as the reference. A static layer holds
   thousands of additive strands; a live layer sends sparks along those strands. */
(function bird() {
  const canvas = document.getElementById("bird");
  const ctx = canvas.getContext("2d");
  const hero = canvas.parentElement;
  const SW = 736, SH = 414;
  let W, H, DPR, scale, ox, oy, staticLayer, tracks = [], sparks = [];
  const pointer = { x: 0, y: 0, tx: 0, ty: 0 };

  const noise = (x, y) => Math.sin(x * 1.3 + Math.sin(y * 1.7)) * .5 + Math.sin(y * 2.1 + Math.sin(x * .9) * 1.4) * .5;

  /* A strand is a cubic with noise pushing it sideways, more toward its tip. */
  function strand(p0, c1, c2, p1, wob, steps = 46) {
    const pts = [], seedX = rand(0, 90), seedY = rand(0, 90);
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, m = 1 - t;
      let x = m*m*m*p0[0] + 3*m*m*t*c1[0] + 3*m*t*t*c2[0] + t*t*t*p1[0];
      let y = m*m*m*p0[1] + 3*m*m*t*c1[1] + 3*m*t*t*c2[1] + t*t*t*p1[1];
      const a = wob * t * t;
      x += noise(seedX + t * 4.5, seedY) * a;
      y += noise(seedY, seedX + t * 4.5) * a;
      pts.push([x, y]);
    }
    return pts;
  }

  const lerp = (a, b, t) => a + (b - a) * t;
  const lerpP = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];

  /* Each fan interpolates between two guide curves [p0, c1, c2, p1]. */
  const fans = [
    { // crown feathers streaming up and right into the top wing
      a: [[398,171],[440,150],[452,90],[462,-14]], b: [[446,200],[500,150],[600,70],[728,-14]],
      n: 1500, wob: 26, hue: "ice" },
    { // main upper wing, wide and bright
      a: [[440,190],[480,120],[540,40],[560,-14]], b: [[468,232],[560,200],[650,120],[780,30]],
      n: 1500, wob: 34, hue: "blue" },
    { // nape curling down into the body
      a: [[452,205],[505,250],[520,300],[560,430]], b: [[470,236],[560,250],[650,300],[770,250]],
      n: 1500, wob: 30, hue: "ice" },
    { // lower breast sweeping to the bottom edge
      a: [[398,250],[452,300],[470,360],[452,430]], b: [[446,258],[510,300],[560,350],[640,430]],
      n: 1200, wob: 32, hue: "blue" },
    { // long tail running out to the left
      a: [[440,262],[420,330],[300,350],[150,300]], b: [[462,262],[440,380],[300,400],[110,430]],
      n: 750, wob: 34, hue: "deep" },
  ];

  /* Head outline, facing left, in scene coordinates. */
  const headPath = new Path2D(`M331 230 C327 218 333 208 346 204 C358 188 374 175 397 170
    C420 166 442 176 456 196 C468 214 472 238 464 262 C440 262 420 256 398 254
    C382 251 370 247 362 238 C356 233 350 232 345 233 C342 226 337 226 331 230 Z`);

  function build() {
    const r = hero.getBoundingClientRect();
    W = r.width; H = r.height;
    DPR = Math.min(devicePixelRatio || 1, 2);
    canvas.width = W * DPR; canvas.height = H * DPR;
    const narrow = W < 1080;
    if (narrow) { // Bird fills the top half of the phone screen
      scale = Math.max(W / 470, H * .62 / 414);
      ox = W * .5 - 490 * scale; oy = -20 * scale;
    } else {
      scale = Math.max(W / 736, H / 414);
      ox = (W - SW * scale) / 2 + W * .06; oy = (H - SH * scale) / 2;
    }

    staticLayer = document.createElement("canvas");
    staticLayer.width = canvas.width; staticLayer.height = canvas.height;
    const s = staticLayer.getContext("2d");
    s.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * ox, DPR * oy);
    s.globalCompositeOperation = "lighter";
    s.lineCap = "round";
    tracks = [];

    const density = narrow ? .55 : 1;
    const colors = {
      ice:  ["rgba(205,228,255,", "rgba(120,170,255,"],
      blue: ["rgba(150,195,255,", "rgba(70,120,240,"],
      deep: ["rgba(110,160,255,", "rgba(60,90,220,"],
    };
    fans.forEach(f => {
      const count = Math.floor(f.n * density);
      for (let i = 0; i < count; i++) {
        const t = Math.pow(Math.random(), .85);
        const j = () => [rand(-5, 5), rand(-5, 5)];
        const add = (p) => { const d = j(); return [p[0] + d[0], p[1] + d[1]]; };
        const pts = strand(add(lerpP(f.a[0], f.b[0], t)), add(lerpP(f.a[1], f.b[1], t)), add(lerpP(f.a[2], f.b[2], t)), add(lerpP(f.a[3], f.b[3], t)), f.wob);
        const [c0, c1] = colors[f.hue];
        const a = rand(.035, .14);
        // Bright near the body, fading to thin colored filament at the tip.
        const split = 24;
        s.lineWidth = rand(.14, .34);
        s.strokeStyle = c0 + a + ")";
        s.beginPath(); pts.slice(0, split + 1).forEach((p, k) => k ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1])); s.stroke();
        s.strokeStyle = c1 + a * .7 + ")";
        s.beginPath(); pts.slice(split).forEach((p, k) => k ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1])); s.stroke();
        if (i % 3 === 0) tracks.push(pts);
      }
    });

    // Head: carve a soft dark pocket out of the feathers, then draw the face from the same light.
    s.globalCompositeOperation = "destination-out";
    const hole = s.createRadialGradient(392, 212, 16, 400, 214, 96);
    hole.addColorStop(0, "rgba(0,0,0,.96)"); hole.addColorStop(.62, "rgba(0,0,0,.86)"); hole.addColorStop(1, "rgba(0,0,0,0)");
    s.fillStyle = hole; s.beginPath(); s.arc(400, 214, 96, 0, 7); s.fill();
    s.globalCompositeOperation = "lighter";

    const bez = (p, t) => { const m = 1 - t; return [0, 1].map((k) => m*m*m*p[0][k] + 3*m*m*t*p[1][k] + 3*m*t*t*p[2][k] + t*t*t*p[3][k]); };
    const crown = [[349,203],[366,170],[424,156],[476,206]];
    const throat = [[360,238],[388,258],[430,256],[486,272]];
    const headPoint = (u, v) => lerpP(bez(crown, u), bez(throat, u), v);

    // Contour feathers follow the skull from brow to nape and hand over to the fans.
    for (let i = 0; i < 2600 * density; i++) {
      const v = Math.random();
      const rim = Math.pow(Math.abs(v - .5) * 2, 2.2);
      if (Math.random() > .3 + rim * .7) continue;
      const u0 = Math.pow(Math.random(), .75) * .9, len = rand(.08, .38);
      const eyeGap = Math.hypot(headPoint(u0, v)[0] - 380, headPoint(u0, v)[1] - 201);
      if (eyeGap < 15) continue;
      s.strokeStyle = `rgba(${205 + rim * 40},${225 + rim * 25},255,${(rand(.06, .2) + rim * .3) * (1 - u0 * .8)})`;
      s.lineWidth = rand(.14, .36);
      s.beginPath();
      for (let k = 0; k <= 8; k++) {
        const u = u0 + len * k / 8;
        const p = headPoint(u, v + Math.sin(u * 9 + i) * .012);
        k ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1]);
      }
      s.stroke();
    }

    // Rim light along crown and throat, fading out toward the wing.
    s.lineWidth = .6; s.shadowColor = "rgba(150,195,255,.95)"; s.shadowBlur = 7 * scale;
    for (const [curve, steps] of [[crown, 40], [throat, 40]]) {
      for (let k = 0; k < steps; k++) {
        const t = k / steps, p = bez(curve, t), q = bez(curve, (k + 1) / steps);
        s.strokeStyle = `rgba(232,242,255,${.85 * (1 - t) * (1 - t) + .05})`;
        s.beginPath(); s.moveTo(p[0], p[1]); s.lineTo(q[0], q[1]); s.stroke();
      }
    }
    s.shadowBlur = 0;

    // Beak: pale steel with a hard hooked tip, the one solid edge in the picture.
    const beak = new Path2D("M333 233 C327 222 331 210 345 204 C354 200 363 203 368 212 C361 214 355 220 352 231 C346 225 339 226 333 233 Z");
    s.globalCompositeOperation = "source-over";
    const g = s.createLinearGradient(336, 203, 362, 232);
    g.addColorStop(0, "#eef3f8"); g.addColorStop(.42, "#9eabbc"); g.addColorStop(1, "#27303f");
    s.fillStyle = g; s.fill(beak);
    s.strokeStyle = "rgba(10,14,24,.8)"; s.lineWidth = .7;
    s.beginPath(); s.moveTo(368, 212); s.quadraticCurveTo(356, 216, 343, 226); s.stroke();
    s.globalCompositeOperation = "lighter";
    s.strokeStyle = "rgba(255,215,150,.75)"; s.lineWidth = .4; s.stroke(beak);

    // Eye.
    s.globalCompositeOperation = "source-over";
    s.fillStyle = "#04060d"; s.beginPath(); s.arc(380, 201, 4.4, 0, 7); s.fill();
    s.globalCompositeOperation = "lighter";
    const eg = s.createRadialGradient(380, 201, .2, 380, 201, 3.5);
    eg.addColorStop(0, "#ffefc4"); eg.addColorStop(.55, "#ffb445"); eg.addColorStop(1, "rgba(255,160,50,.1)");
    s.fillStyle = eg; s.beginPath(); s.arc(380, 201, 3.5, 0, 7); s.fill();
    s.globalCompositeOperation = "source-over";
    s.fillStyle = "#03050b"; s.beginPath(); s.arc(379.6, 201, 1.6, 0, 7); s.fill();
    s.fillStyle = "#fff"; s.beginPath(); s.arc(378.8, 200.1, .55, 0, 7); s.fill();
    s.globalCompositeOperation = "lighter";
    s.strokeStyle = "rgba(240,247,255,.85)"; s.lineWidth = .7;
    s.beginPath(); s.moveTo(366, 198.5); s.quadraticCurveTo(379, 191.5, 394, 199); s.stroke();

    // Fixed dust scattered around the bird.
    for (let i = 0; i < 2200 * density; i++) {
      const p = tracks[Math.floor(Math.random() * tracks.length)];
      const q = p[Math.floor(rand(8, p.length))];
      const gold = Math.random() < .2;
      const sz = Math.random() < .05 ? rand(.7, 1.5) : rand(.15, .55);
      s.fillStyle = gold ? `rgba(255,205,125,${rand(.4, .95)})` : `rgba(200,225,255,${rand(.3, .9)})`;
      s.beginPath(); s.arc(q[0] + rand(-7, 7), q[1] + rand(-7, 7), sz, 0, 7); s.fill();
    }

    const n = reduced ? 0 : (narrow ? 260 : 620);
    sparks = Array.from({ length: n }, () => newSpark(true));
    paint(performance.now());
  }

  function newSpark(any) {
    return { track: tracks[Math.floor(Math.random() * tracks.length)], t: any ? Math.random() : rand(0, .25), speed: rand(.0005, .0022), size: rand(.3, 1.05), gold: Math.random() < .3, phase: rand(0, 6) };
  }

  function paint(now) {
    pointer.x += (pointer.tx - pointer.x) * .05;
    pointer.y += (pointer.ty - pointer.y) * .05;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(staticLayer, pointer.x * 10 * DPR, pointer.y * 8 * DPR);
    ctx.globalCompositeOperation = "lighter";
    ctx.setTransform(DPR * scale, 0, 0, DPR * scale, DPR * (ox + pointer.x * 18), DPR * (oy + pointer.y * 14));
    for (const p of sparks) {
      p.t += p.speed;
      if (p.t > 1) Object.assign(p, newSpark(false));
      const f = p.t * (p.track.length - 1), i = Math.floor(f), k = f - i;
      const a = p.track[i], b = p.track[Math.min(i + 1, p.track.length - 1)];
      const x = a[0] + (b[0] - a[0]) * k, y = a[1] + (b[1] - a[1]) * k;
      const tw = .5 + .5 * Math.sin(now * .004 + p.phase);
      const fade = Math.min(1, Math.min(p.t, 1 - p.t) * 8);
      ctx.fillStyle = p.gold ? `rgba(255,205,125,${.9 * tw * fade})` : `rgba(215,235,255,${.85 * tw * fade})`;
      ctx.beginPath(); ctx.arc(x, y, p.size, 0, 7); ctx.fill();
    }
  }

  let running = false;
  function loop(now) { if (!running) return; paint(now); requestAnimationFrame(loop); }
  function start() { if (!running && !reduced) { running = true; requestAnimationFrame(loop); } }
  function stop() { running = false; }

  build();
  drawTethers();
  start();
  new IntersectionObserver(([e]) => (e.isIntersecting ? start() : stop())).observe(hero);
  addEventListener("pointermove", (e) => { pointer.tx = e.clientX / innerWidth - .5; pointer.ty = e.clientY / innerHeight - .5; }, { passive: true });
  let t, lastW = innerWidth;
  addEventListener("resize", () => {
    clearTimeout(t);
    t = setTimeout(() => { if (innerWidth !== lastW || innerWidth > 720) { lastW = innerWidth; build(); drawTethers(); } }, 200);
  });

  /* Thin lines from each callout back to a point on the bird. */
  function drawTethers() {
    const svg = document.getElementById("tethers");
    const box = hero.getBoundingClientRect();
    svg.innerHTML = "";
    svg.setAttribute("viewBox", `0 0 ${box.width} ${box.height}`);
    hero.querySelectorAll(".call").forEach((call) => {
      if (getComputedStyle(call).display === "none") return;
      const r = call.getBoundingClientRect();
      const [ax, ay] = call.dataset.anchor.split(",").map(Number);
      const tx = ox + ax * scale, ty = oy + ay * scale;
      const sx = r.left - box.left, sy = r.top - box.top + r.height / 2;
      const d = `M${sx} ${sy} C${sx - 40} ${sy}, ${tx + 40} ${ty}, ${tx} ${ty}`;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d);
      svg.appendChild(path);
      path.style.setProperty("--len", Math.ceil(path.getTotalLength()));
      const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("cx", tx); dot.setAttribute("cy", ty); dot.setAttribute("r", 3);
      svg.appendChild(dot);
    });
  }
})();

/* ---------- Callouts ---------- */
document.getElementById("c-found").textContent = ANA.found;
document.getElementById("c-goal").textContent = `${ANA.goal.saved.toLocaleString("ro-RO")} / ${ANA.goal.target.toLocaleString("ro-RO")} lei`;
document.getElementById("c-pot").textContent = ANA.pot.expected.label;
document.getElementById("r-net").textContent = ANA.netWorth;

/* ---------- Forecast fan ---------- */
(function fan() {
  const svg = document.getElementById("fan");
  const NS = "http://www.w3.org/2000/svg";
  const L = 72, R = 736, T = 12, B = 360, MAX = 1500000;
  const x = (age) => L + (age - 29) / 36 * (R - L);
  const y = (v) => B - v / MAX * (B - T);
  const line = (rate) => {
    let d = "";
    for (let a = 29; a <= 65; a++) d += `${a === 29 ? "M" : "L"}${x(a).toFixed(1)} ${y(ANA.potAt(rate, a - 29)).toFixed(1)} `;
    return d;
  };
  const el = (name, attrs, parent = svg) => { const n = document.createElementNS(NS, name); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };
  const fmt = (v) => v === 0 ? "0" : `${v / 1000000} mil.`;

  [0, 500000, 1000000, 1500000].forEach((v) => {
    el("line", { x1: L, x2: R, y1: y(v), y2: y(v), stroke: "rgba(170,200,255,.13)" });
    el("text", { x: 0, y: y(v) + 4, class: "axis" }).textContent = fmt(v);
  });
  [29, 40, 50, 60, 65].forEach((a) => { el("text", { x: x(a), y: 388, class: "axis", "text-anchor": a === 65 ? "end" : "middle" }).textContent = a === 29 ? "Age 29" : a; });

  const defs = el("defs", {});
  const grad = el("linearGradient", { id: "bandfill", x1: 0, x2: 1 }, defs);
  el("stop", { offset: 0, "stop-color": "#7fb6ff", "stop-opacity": .02 }, grad);
  el("stop", { offset: 1, "stop-color": "#7fb6ff", "stop-opacity": .2 }, grad);

  const low = line(.02), high = line(.06);
  const lowRev = low.trim().split(/ (?=[ML])/).reverse().map((s) => s.replace("M", "L")).join(" ");
  el("path", { d: `${high} ${lowRev} Z`, fill: "url(#bandfill)" });

  const paths = {};
  for (const key of ["cautious", "optimistic", "expected"]) {
    const d = line(ANA.pot[key].rate);
    const glow = el("path", { d, fill: "none", stroke: "#7fb6ff", "stroke-width": 7, "stroke-linecap": "round", opacity: 0 });
    const main = el("path", { d, fill: "none", stroke: "#a9c3e8", "stroke-width": 1.2, "stroke-linecap": "round" });
    paths[key] = { glow, main };
  }
  const dot = el("circle", { r: 5, fill: "#ffc873" });

  function select(key) {
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.path === key));
    for (const k in paths) {
      const on = k === key;
      paths[k].main.setAttribute("stroke", on ? "#fff" : "#7c8fb1");
      paths[k].main.setAttribute("stroke-width", on ? 2 : 1.1);
      paths[k].glow.setAttribute("opacity", on ? .28 : 0);
    }
    dot.setAttribute("cx", x(65)); dot.setAttribute("cy", y(ANA.potAt(ANA.pot[key].rate, 36)));
    document.getElementById("r-pot").textContent = ANA.pot[key].label;
    document.getElementById("r-age").textContent = ANA.pot[key].lasts;
  }
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => select(b.dataset.path)));
  select("expected");
})();

/* ---------- Closing embers ---------- */
(function embers() {
  const c = document.getElementById("embers"), g = c.getContext("2d");
  let w, h, pts = [];
  function size() {
    const r = c.parentElement.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
    w = r.width; h = r.height; c.width = w * d; c.height = h * d; g.setTransform(d, 0, 0, d, 0, 0);
    pts = Array.from({ length: w < 720 ? 90 : 200 }, () => ({ x: rand(0, w), y: rand(0, h), v: rand(.08, .4), s: rand(.4, 1.6), gold: Math.random() < .35, p: rand(0, 6) }));
  }
  function draw(now) {
    g.clearRect(0, 0, w, h);
    g.globalCompositeOperation = "lighter";
    for (const p of pts) {
      if (!reduced) { p.y -= p.v; p.x += Math.sin(now * .0004 + p.p) * .15; if (p.y < -4) p.y = h + 4; }
      const edge = Math.min(p.y, h - p.y) / 120, a = Math.max(0, Math.min(1, edge)) * (.5 + .5 * Math.sin(now * .002 + p.p));
      g.fillStyle = p.gold ? `rgba(255,205,125,${a})` : `rgba(190,220,255,${a})`;
      g.beginPath(); g.arc(p.x, p.y, p.s, 0, 7); g.fill();
    }
  }
  let on = false;
  const tick = (t) => { if (on) { draw(t); requestAnimationFrame(tick); } };
  size(); draw(800);
  if (!reduced) new IntersectionObserver(([e]) => { on = e.isIntersecting; if (on) requestAnimationFrame(tick); }).observe(c);
  addEventListener("resize", () => { size(); draw(800); });
})();
</script>
</body>
</html>
